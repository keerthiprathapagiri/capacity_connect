{% extends "base.html" %}{% block content %}<h2>Doubts</h2><form method=post action="{{url_for('doubts.ask')}}"><textarea name=question class=form-control required placeholder="What are you stuck on?"></textarea><input name=topic class="form-control my-2" placeholder=Topic><label><input type=checkbox name=anonymous> Anonymous</label><button class="btn btn-primary mt-2">Post doubt</button></form><hr>{% for d in doubts %}<div class=card p-3 mb-2>{{'Anonymous' if d.anonymous else 'Learner'}}: {{d.question}}</div>{% endfor %}{% endblock %}
