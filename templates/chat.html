{% extends "base.html" %}{% block content %}<h2>Chat</h2><div id=messages>{% for m in messages %}<p>{{m.body}}</p>{% endfor %}</div><input id=body class=form-control placeholder="Message"><button id=send class="btn btn-primary mt-2">Send</button><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script>const s=io();s.emit('join',{room:'general'});send.onclick=()=>{s.emit('message',{room:'general',body:body.value});body.value=''};s.on('message',m=>messages.innerHTML+='<p>'+m.body+'</p>')</script>{% endblock %}
