{% extends "base.html" %}{% block content %}<h2>{{lecture.title}}</h2><p>{{lecture.description}}</p>{% if lecture.video_path %}<video id=lecture-video controls class="w-100 rounded" src="{{url_for('static',filename=lecture.video_path)}}"></video>{% endif %}<div class="card p-3 mt-3"><h4>Transcript search</h4><input id=transcript-search class=form-control placeholder="Search transcript"><div id=transcript-results class=mt-2></div></div><form method=post action="{{url_for('learner.teach_back',lecture_id=lecture.id)}}" class="card p-3 mt-3"><h4>Teach it back</h4><textarea name=response class=form-control minlength=10 required placeholder="Explain the key idea in your own words..."></textarea><button class="btn btn-info mt-2">Submit teach-back</button></form><form method=post action="{{url_for('doubts.ask')}}" class="card p-3 mt-3"><textarea name=question class=form-control required placeholder="Ask a doubt..."></textarea><input name=topic class="form-control my-2" placeholder=Topic><label><input type=checkbox name=anonymous> Ask anonymously</label><button class="btn btn-warning mt-2">Ask</button></form><script>fetch('{{url_for('courses.transcript',lecture_id=lecture.id)}}').then(r=>r.json()).then(rows=>{const out=document.getElementById('transcript-results'),q=document.getElementById('transcript-search'),v=document.getElementById('lecture-video');function render(){out.innerHTML=rows.filter(x=>(x.text||'').toLowerCase().includes(q.value.toLowerCase())).map(x=>`<button type=button class="btn btn-sm btn-outline-info d-block text-start w-100 my-1" data-time="${x.start||x.timestamp||0}">${x.text}</button>`).join('');out.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(v)v.currentTime=Number(b.dataset.time);})}q.oninput=render;render()})</script>{% endblock %}
