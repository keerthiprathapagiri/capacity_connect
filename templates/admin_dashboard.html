{% extends "base.html" %}{% block content %}<h2>Admin dashboard</h2><p>{{users|length}} users · {{courses|length}} courses</p>{% for u in users %}<div class="card p-3 my-2">{{u.name}} ({{u.role}} / {{u.approval_status}}) {% if u.role=='trainer' and u.approval_status!='approved' %}<a class="btn btn-sm btn-info ms-2" href="{{url_for('admin.approve',user_id=u.id)}}">Approve</a><a class="btn btn-sm btn-outline-danger ms-2" href="{{url_for('admin.reject',user_id=u.id)}}">Reject</a>{% endif %}</div>{% endfor %}{% endblock %}
